<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <!-- Gold gradient for icon -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e4c97e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c9a84c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8a6520;stop-opacity:1" />
    </linearGradient>

    <!-- Gold gradient for text -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f0d978;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#c9a84c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a07830;stop-opacity:1" />
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle shadow for icon bg -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#c9a84c" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ═══ ICON BACKGROUND ═══ -->
  <!-- Outer rounded square with gold border -->
  <rect x="4" y="4" width="68" height="68" rx="18" ry="18"
        fill="#0e1120" stroke="url(#goldGrad)" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Inner subtle glow layer -->
  <rect x="8" y="8" width="60" height="60" rx="14" ry="14"
        fill="none" stroke="#c9a84c" stroke-width="0.4" opacity="0.4"/>

  <!-- ═══ BOOK SHAPE ═══ -->
  <!-- Back cover of book -->
  <rect x="20" y="18" width="34" height="42" rx="5" ry="5"
        fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.5"/>

  <!-- Front cover of book -->
  <rect x="16" y="16" width="34" height="42" rx="5" ry="5"
        fill="#1a2240" stroke="url(#goldGrad)" stroke-width="1.8"/>

  <!-- Book spine highlight -->
  <rect x="16" y="16" width="6" height="42" rx="3" ry="3"
        fill="url(#goldGrad)" opacity="0.9"/>

  <!-- Book pages lines -->
  <line x1="28" y1="26" x2="44" y2="26" stroke="#c9a84c" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
  <line x1="28" y1="32" x2="44" y2="32" stroke="#c9a84c" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
  <line x1="28" y1="38" x2="38" y2="38" stroke="#c9a84c" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>

  <!-- ═══ STAR / SPARKLE MARK ═══ -->
  <!-- Central 4-point star over the book -->
  <g transform="translate(38, 48)" filter="url(#glow)">
    <!-- 4-point star -->
    <path d="M0,-8 L1.8,-1.8 L8,0 L1.8,1.8 L0,8 L-1.8,1.8 L-8,0 L-1.8,-1.8 Z"
          fill="url(#goldGrad)" opacity="0.95"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="1.5" fill="#fff" opacity="0.9"/>
  </g>

  <!-- ═══ DECORATIVE CORNER DOTS ═══ -->
  <circle cx="23" cy="52" r="1.2" fill="#c9a84c" opacity="0.6"/>
  <circle cx="27" cy="52" r="1.2" fill="#c9a84c" opacity="0.6"/>
  <circle cx="31" cy="52" r="1.2" fill="#c9a84c" opacity="0.6"/>

  <!-- ═══ WORDMARK "BOOKIFY" ═══ -->
  <text
    x="90"
    y="52"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="36"
    font-weight="700"
    letter-spacing="4"
    fill="url(#textGrad)"
    filter="url(#glow)"
  >BOOKIFY</text>

  <!-- ═══ TAGLINE ═══ -->
  <text
    x="91"
    y="67"
    font-family="'Arial', sans-serif"
    font-size="9"
    font-weight="400"
    letter-spacing="3.5"
    fill="#c9a84c"
    opacity="0.65"
  >PREMIUM STAYS</text>

  <!-- ═══ GOLD UNDERLINE ACCENT ═══ -->
  <line x1="90" y1="71" x2="308" y2="71"
        stroke="url(#textGrad)" stroke-width="0.8" opacity="0.4"/>
</svg>
